{% extends "base.html" %}
{% block title %}Recuperar administrador | Facturas{% endblock %}
{% block content %}
<main class="card">
  <h1>Recuperar administrador</h1>
  <p class="muted">Este formulario restablece la contraseña de la cuenta indicada por APP_USERNAME. El token solo se puede usar una vez.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="token">Token de recuperación</label>
    <input id="token" name="token" type="password" autocomplete="off" required>
    <label for="password">Nueva contraseña</label>
    <input id="password" type="password" name="password" autocomplete="new-password" minlength="10" required>
    <label for="password_confirmation">Confirmar contraseña</label>
    <input id="password_confirmation" type="password" name="password_confirmation" autocomplete="new-password" minlength="10" required>
    <p><button type="submit">Restablecer contraseña</button></p>
  </form>
</main>
{% endblock %}
